<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Secrète - VOTEJAM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #1a0000; color: #FFFFFF; font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 20px; font-weight: bold; }
        .admin-container { width: 100%; max-width: 480px; }
        h1 { color: #FF0044; text-align: center; margin-bottom: 30px; font-size: 24px; text-transform: uppercase; }
        
        /* Contrôles du chrono */
        .timer-controls { display: flex; gap: 10px; margin-bottom: 30px; }
        .time-input { width: 90px; background-color: #000; border: 2px solid #FFE600; color: #FFE600; font-size: 20px; font-weight: 900; text-align: center; font-family: monospace; }
        
        /* NOUVEAU : Bouton SET TIME */
        .btn-set { background-color: #333; color: #FFF; border: 2px solid #FFE600; padding: 15px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-set:active { background-color: #FFE600; color: #000; }

        .btn-timer { flex-grow: 1; background-color: #FFE600; color: #000; border: none; padding: 15px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-timer:active { background-color: #FFF; }

        .admin-card { background-color: #000; border: 2px solid #333; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .admin-card h3 { font-size: 16px; text-transform: uppercase; }
        .score-input { width: 80px; padding: 10px; background: #222; border: 1px solid #FF0044; color: white; font-weight: 900; text-align: center; font-size: 16px; }
        
        .btn-update { width: 100%; background-color: #FF0044; color: white; border: none; padding: 15px; font-size: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 20px; }
        
        .btn-danger { width: 100%; background-color: #FF8800; color: #000; border: none; padding: 15px; font-size: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        
        .btn-reset { width: 100%; background-color: transparent; color: #888; border: 1px solid #333; padding: 10px; font-size: 12px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>PANNEAU SECRET ADMIN</h1>
        
        <!-- Les boutons du chrono -->
        <div class="timer-controls">
            <input type="text" id="time-input" class="time-input" value="05:00" maxlength="5">
            <button class="btn-set" onclick="setTimer()">SET TIME</button>
            <button class="btn-timer" onclick="lancerChrono()">LANCER</button>
        </div>
        
        <div id="admin-riders-list"></div>

        <button class="btn-update" onclick="sauvegarderScores()">FORCER LES SCORES</button>
        <button class="btn-danger" onclick="reinitialiserClassement()">TOUT REMETTRE À ZÉRO</button>
        <button class="btn-reset" onclick="debloquerMonVote()">Débloquer mon propre vote (Test)</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="admin.js"></script>
       <!-- ==========================================
         MODULE SECRET : CLASSEMENT EN TEMPS RÉEL
         ========================================== -->
    <div style="margin-top: 40px; padding: 20px; background: #fff; border: 4px solid #000; font-family: 'Helvetica Neue', Arial, sans-serif;">
        <h2 style="margin-top: 0; margin-bottom: 20px; color: #FF0044; text-transform: uppercase; font-weight: 900;">
            🔒 CLASSEMENT OFFICIEL (RÉGIE)
        </h2>
        <div id="admin-leaderboard">Chargement des scores en direct...</div>
    </div>

    <script>
        // Écoute de la base de données Firebase pour afficher le classement secret
        const adminRidersRef = firebase.database().ref('riders');

        adminRidersRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const container = document.getElementById('admin-leaderboard');
                const ridersArray = [];
                
                for (let id in data) {
                    ridersArray.push({ nom: data[id].nom, votes: data[id].votes });
                }
                
                // Tri des riders du premier au dernier
                ridersArray.sort((a, b) => b.votes - a.votes);

                // Création du tableau de bord
                let html = '<table style="width: 100%; border-collapse: collapse; font-size: 18px; text-transform: uppercase;">';
                ridersArray.forEach((rider, index) => {
                    const estPremier = index === 0;
                    const bgColor = estPremier ? '#FFE600' : '#F4F4F4';
                    const textColor = estPremier ? '#000' : '#333';
                    
                    html += `
                        <tr style="background: ${bgColor}; color: ${textColor}; border-bottom: 2px solid #000;">
                            <td style="padding: 12px; font-weight: 900; width: 60px; border-right: 2px solid #000;">#${index + 1}</td>
                            <td style="padding: 12px; font-weight: bold;">${rider.nom}</td>
                            <td style="padding: 12px; font-weight: 900; text-align: right;">${rider.votes} PTS</td>
                        </tr>
                    `;
                });
                html += '</table>';
                
                container.innerHTML = html;
            }
        });
    </script>
 
</body>
</html>
